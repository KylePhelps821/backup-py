[project]
name = "backup-py"
version = "0.1.0"
description = "自动备份脚本（Python版）"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "kylehelps", email = "kylehelps@qq.com"}
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py310']

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]