services:
  backup:
    build:
      context: .
      dockerfile: Dockerfile
    image: kylephelps/backup-py:v2    # ← 改成你的 Docker Hub 镜像名
    container_name: backup-service
    env_file:
      - .env
    volumes:
      - ./test_data:/app/data:ro
      - backup_data:/app/backups
    restart: "no"
    networks:
      - backup-net

volumes:
  backup_data:

networks:
  backup-net:
    driver: bridge